name: الاختبارات وملف التثبيت (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: تثبيت المكتبات
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: تنزيل الخط العربي (رخصة OFL)
        run: bash outils/telecharger_polices.sh
      - name: الاختبارات
        run: |
          mkdir -p rapports
          set +e
          python -m pytest -v -rs > rapports/pytest.txt 2>&1
          echo $? > rapports/code_retour.txt
          cat rapports/pytest.txt
          exit $(cat rapports/code_retour.txt)
      - name: لقطات الواجهة
        if: always()
        run: python outils/captures.py rapports/captures > rapports/captures.txt 2>&1 || cat rapports/captures.txt
      - name: نشر التقرير في فرع rapports
        if: always()
        run: |
          cd rapports
          echo "${GITHUB_SHA}" > commit.txt
          git init -q -b rapports
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "rapport ${GITHUB_SHA::7} run ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" rapports

  installateur:
    needs: tests
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: تثبيت المكتبات
        run: python -m pip install -r requirements.txt pyinstaller
      - name: تنزيل الخط العربي
        run: bash outils/telecharger_polices.sh
      - name: بناء التطبيق
        run: >
          pyinstaller --noconfirm --windowed --name Idara
          --hidden-import win32com.client --hidden-import pythoncom
          --icon idara/resources/icone.ico
          --add-data "idara/data/migrations;idara/data/migrations"
          --add-data "idara/resources;idara/resources"
          lancer.py
      - name: فحص ذاتي للنسخة المبنية
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          timeout 180 ./dist/Idara/Idara.exe --verification verification.txt; code=$?
          cat verification.txt || true
          grep -q VERIFICATION_OK verification.txt || (echo "فشل الفحص الذاتي (code=$code)"; exit 1)
      - name: إنشاء ملف التثبيت
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DVersion=$env:VERSION" installateur\idara.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: نشر ملف التثبيت في صفحة الإصدارات
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" dist-installateur/*.exe --prerelease \
            --title "نسخة تجريبية ${VERSION}" \
            --notes "نسخة تجريبية مبنية آلياً من الالتزام ${GITHUB_SHA::7}. اجتازت الاختبارات الآلية والفحص الذاتي على Windows."
